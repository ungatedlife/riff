[package]
name = "riff"
version = "0.3.1"
description = "A quiet room for writing one small, complete thing at a time"
authors = ["Rob Hardy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset", "devtools"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = "0.12"
arboard = "3"
base64 = "0.22"
tauri-plugin-dialog = "2.6.0"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication"] }

[features]
# The custom-protocol feature tells tauri-codegen to embed the frontend
# from `frontendDist` instead of connecting to `devUrl`. `cargo tauri
# build` enables it implicitly; `cargo tauri dev` leaves it off so the
# vite dev server is used. Our dev-rebuild.sh passes it explicitly via
# `cargo build --features custom-protocol` because it bypasses tauri-cli.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
